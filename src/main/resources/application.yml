server:
  port: 8080
  servlet:
    context-path: /api
# SpringDoc配置
springdoc:
  # 仅扫描api层controller包下的接口
  packages-to-scan: com.object.ai.craft.api.controller
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
# 部署配置
deploy:
  # 站点访问基础地址：生产环境填 nginx 地址（如 http://localhost:8082），
  # 开发环境指向后端自身静态托管（PreviewResourceConfig）即可免 nginx 预览
  nginx-base-url: http://localhost:8080/api
# 数据库配置
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    password: hdN3Q46Wd2mW3PFE
    username: zephyr_craft
    url: jdbc:mysql://171.80.4.168:3306/zephyr_craft
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    active: local
############## Sa-Token 配置 (文档: https://sa-token.com) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: zephyr-craft
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 是否从 Cookie 中读取 token
  is-read-cookie: true
  # 是否从请求头中读取 token
  is-read-header: true
